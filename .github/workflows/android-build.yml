name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android APK (GameCI)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          FH_ANDROID_BUNDLE: "false"
          FH_ANDROID_ARTIFACT: fortune-heist-ci.apk
        with:
          targetPlatform: Android
          buildMethod: FortuneHeist.Editor.AndroidBuildPipeline.BuildAndroidForCI

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: Builds/Android/*
